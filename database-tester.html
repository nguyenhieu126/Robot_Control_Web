<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control - Database Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.3em;
            font-weight: bold;
        }

        .card-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.95em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .result-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .result-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .result-content {
            background: white;
            padding: 10px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #333;
            border-left: 4px solid #667eea;
        }

        .success {
            color: #27ae60;
            border-left-color: #27ae60;
        }

        .error {
            color: #e74c3c;
            border-left-color: #e74c3c;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online {
            background: #27ae60;
        }

        .status-offline {
            background: #e74c3c;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .timestamp {
            color: #999;
            font-size: 0.85em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Robot Control System</h1>
            <p>Database Tester & API Explorer</p>
        </div>

        <!-- Status Section -->
        <div class="card full-width">
            <div class="card-header">📊 System Status</div>
            <div class="card-body">
                <div class="result-container" id="status-container">
                    <div class="stat-box">
                        <div class="status-indicator status-offline"></div>
                        <div class="label">API Server</div>
                        <div class="number" id="server-status">-</div>
                    </div>
                    <div class="stat-box">
                        <div class="status-indicator status-offline"></div>
                        <div class="label">Database</div>
                        <div class="number" id="db-status">-</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="total-users">0</div>
                        <div class="label">Users</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="total-detections">0</div>
                        <div class="label">Detections</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="total-events">0</div>
                        <div class="label">Events</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="total-commands">0</div>
                        <div class="label">Commands</div>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="checkAllStatus()">🔄 Refresh Status</button>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid">
            <!-- Users Card -->
            <div class="card">
                <div class="card-header">👥 Users Management</div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="user-username" placeholder="e.g., operator2">
                    </div>
                    <div class="form-group">
                        <label>Password Hash</label>
                        <input type="text" id="user-password" placeholder="$2b$10$...">
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="user-role">
                            <option value="admin">Admin</option>
                            <option value="operator" selected>Operator</option>
                            <option value="security">Security</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="createUser()">➕ Create User</button>
                    <button class="btn btn-secondary" onclick="loadUsers()">📋 Load All Users</button>
                    <div class="result" id="users-result"></div>
                </div>
            </div>

            <!-- Detections Card -->
            <div class="card">
                <div class="card-header">🎯 Detections</div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Object Type</label>
                        <input type="text" id="detection-type" placeholder="e.g., backpack">
                    </div>
                    <div class="form-group">
                        <label>Confidence</label>
                        <input type="number" id="detection-confidence" placeholder="0.95" min="0" max="1" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Image Path</label>
                        <input type="text" id="detection-image" placeholder="/images/frame_004.jpg">
                    </div>
                    <div class="form-group">
                        <label>Location X</label>
                        <input type="number" id="detection-x" placeholder="150.5">
                    </div>
                    <div class="form-group">
                        <label>Location Y</label>
                        <input type="number" id="detection-y" placeholder="200.3">
                    </div>
                    <button class="btn btn-primary" onclick="createDetection()">➕ Create Detection</button>
                    <button class="btn btn-secondary" onclick="loadDetections()">📋 Load Detections</button>
                    <div class="result" id="detections-result"></div>
                </div>
            </div>

            <!-- Events Card -->
            <div class="card">
                <div class="card-header">🚨 Abandoned Events</div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Detection ID</label>
                        <input type="number" id="event-detection" placeholder="1">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="event-status">
                            <option value="pending">Pending</option>
                            <option value="confirmed">Confirmed</option>
                            <option value="false_alarm">False Alarm</option>
                            <option value="resolved">Resolved</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Duration (seconds)</label>
                        <input type="number" id="event-duration" placeholder="300" value="300">
                    </div>
                    <button class="btn btn-primary" onclick="loadEventsByStatus('pending')">⏳ Pending Events</button>
                    <button class="btn btn-secondary" onclick="loadAllEvents()">📋 All Events</button>
                    <div class="result" id="events-result"></div>
                </div>
            </div>

            <!-- Commands Card -->
            <div class="card">
                <div class="card-header">⚙️ Manual Commands</div>
                <div class="card-body">
                    <div class="form-group">
                        <label>User ID</label>
                        <input type="number" id="command-user" placeholder="1">
                    </div>
                    <div class="form-group">
                        <label>Command</label>
                        <select id="command-type">
                            <option value="MOVE_FORWARD">Move Forward</option>
                            <option value="MOVE_BACKWARD">Move Backward</option>
                            <option value="TURN_LEFT">Turn Left</option>
                            <option value="TURN_RIGHT">Turn Right</option>
                            <option value="STOP">Stop</option>
                            <option value="GO_TO_POINT">Go To Point</option>
                            <option value="EMERGENCY_STOP">Emergency Stop</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Parameters (JSON)</label>
                        <textarea id="command-params" placeholder='{"distance": 10}' rows="2"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="createCommand()">➕ Create Command</button>
                    <button class="btn btn-secondary" onclick="loadPendingCommands()">⏳ Pending Commands</button>
                    <div class="result" id="commands-result"></div>
                </div>
            </div>

            <!-- Logs Card -->
            <div class="card">
                <div class="card-header">📝 Robot Logs</div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Event Type</label>
                        <select id="log-event">
                            <option value="SYSTEM_START">System Start</option>
                            <option value="AUTO_MODE">Auto Mode</option>
                            <option value="MANUAL_MODE">Manual Mode</option>
                            <option value="OBJECT_DETECTED">Object Detected</option>
                            <option value="ABANDONED_OBJECT">Abandoned Object</option>
                            <option value="SYSTEM_STOP">System Stop</option>
                            <option value="ERROR">Error</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea id="log-message" placeholder="Log message" rows="2"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="createLog()">➕ Create Log</button>
                    <button class="btn btn-secondary" onclick="loadRecentLogs()">📋 Recent Logs</button>
                    <div class="result" id="logs-result"></div>
                </div>
            </div>

            <!-- Advanced Tools -->
            <div class="card">
                <div class="card-header">🔧 Advanced Tools</div>
                <div class="card-body">
                    <button class="btn btn-secondary" onclick="getStats()">📊 Get Statistics</button>
                    <button class="btn btn-secondary" onclick="testAllEndpoints()">🧪 Test All Endpoints</button>
                    <button class="btn btn-secondary" onclick="clearResults()">🗑️ Clear Results</button>
                    <button class="btn btn-secondary" onclick="exportJSON()">💾 Export Data</button>
                    <div class="result" id="advanced-result"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // Utility Functions
        function showResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            if (!element) return;
            
            const resultDiv = element.querySelector('.result') || element;
            resultDiv.innerHTML = `
                <div class="result-title">${isError ? '❌ Error' : '✅ Success'}</div>
                <div class="result-content ${isError ? 'error' : 'success'}">
                    ${typeof data === 'string' ? data : JSON.stringify(data, null, 2)}
                </div>
                <div class="timestamp">${new Date().toLocaleString('vi-VN')}</div>
            `;
        }

        // Check Status
        async function checkAllStatus() {
            try {
                // Check Server
                const serverResponse = await fetch(`${API_URL}/health`);
                const serverStatus = serverResponse.ok ? 'Online' : 'Offline';
                document.getElementById('server-status').textContent = serverStatus;
                document.querySelector('.status-indicator.status-offline:nth-child(1)').className = 
                    serverResponse.ok ? 'status-indicator status-online' : 'status-indicator status-offline';

                // Check Database
                const dbResponse = await fetch(`${API_URL}/db-health`);
                const dbStatus = dbResponse.ok ? 'Online' : 'Offline';
                document.getElementById('db-status').textContent = dbStatus;

                // Count records
                const usersResponse = await fetch(`${API_URL}/users`);
                const usersData = await usersResponse.json();
                document.getElementById('total-users').textContent = usersData.count || 0;

                const detectionsResponse = await fetch(`${API_URL}/detections`);
                const detectionsData = await detectionsResponse.json();
                document.getElementById('total-detections').textContent = detectionsData.count || 0;

                const eventsResponse = await fetch(`${API_URL}/events`);
                const eventsData = await eventsResponse.json();
                document.getElementById('total-events').textContent = eventsData.count || 0;

                const commandsResponse = await fetch(`${API_URL}/commands`);
                const commandsData = await commandsResponse.json();
                document.getElementById('total-commands').textContent = commandsData.count || 0;
            } catch (error) {
                document.getElementById('server-status').textContent = 'Error';
                document.getElementById('db-status').textContent = 'Error';
                console.error('Status check error:', error);
            }
        }

        // Users
        async function createUser() {
            const username = document.getElementById('user-username').value;
            const passwordHash = document.getElementById('user-password').value;
            const role = document.getElementById('user-role').value;

            if (!username || !passwordHash) {
                alert('Please fill all fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, passwordHash, role })
                });
                const data = await response.json();
                showResult('user-username', data, !response.ok);
                if (response.ok) {
                    document.getElementById('user-username').value = '';
                    document.getElementById('user-password').value = '';
                    checkAllStatus();
                }
            } catch (error) {
                showResult('user-username', error.message, true);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/users`);
                const data = await response.json();
                showResult('user-username', data);
            } catch (error) {
                showResult('user-username', error.message, true);
            }
        }

        // Detections
        async function createDetection() {
            const data = {
                objectType: document.getElementById('detection-type').value,
                confidence: parseFloat(document.getElementById('detection-confidence').value),
                imagePath: document.getElementById('detection-image').value,
                locationX: parseFloat(document.getElementById('detection-x').value),
                locationY: parseFloat(document.getElementById('detection-y').value)
            };

            if (!data.objectType || !data.imagePath || !data.confidence || !data.locationX || !data.locationY) {
                alert('Please fill all fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/detections`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                showResult('detection-type', result, !response.ok);
                if (response.ok) {
                    document.getElementById('detection-type').value = '';
                    document.getElementById('detection-confidence').value = '';
                    document.getElementById('detection-image').value = '';
                    document.getElementById('detection-x').value = '';
                    document.getElementById('detection-y').value = '';
                    checkAllStatus();
                }
            } catch (error) {
                showResult('detection-type', error.message, true);
            }
        }

        async function loadDetections() {
            try {
                const response = await fetch(`${API_URL}/detections?limit=20`);
                const data = await response.json();
                showResult('detection-type', data);
            } catch (error) {
                showResult('detection-type', error.message, true);
            }
        }

        // Events
        async function loadEventsByStatus(status) {
            try {
                const response = await fetch(`${API_URL}/events/status/${status}`);
                const data = await response.json();
                showResult('event-detection', data);
            } catch (error) {
                showResult('event-detection', error.message, true);
            }
        }

        async function loadAllEvents() {
            try {
                const response = await fetch(`${API_URL}/events?limit=20`);
                const data = await response.json();
                showResult('event-detection', data);
            } catch (error) {
                showResult('event-detection', error.message, true);
            }
        }

        // Commands
        async function createCommand() {
            const data = {
                userId: parseInt(document.getElementById('command-user').value),
                command: document.getElementById('command-type').value,
                parameters: document.getElementById('command-params').value || null
            };

            if (!data.userId || !data.command) {
                alert('Please fill required fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/commands`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                showResult('command-user', result, !response.ok);
                if (response.ok) checkAllStatus();
            } catch (error) {
                showResult('command-user', error.message, true);
            }
        }

        async function loadPendingCommands() {
            try {
                const response = await fetch(`${API_URL}/commands/pending/all`);
                const data = await response.json();
                showResult('command-user', data);
            } catch (error) {
                showResult('command-user', error.message, true);
            }
        }

        // Logs
        async function createLog() {
            const data = {
                event: document.getElementById('log-event').value,
                message: document.getElementById('log-message').value
            };

            if (!data.message) {
                alert('Please enter a message');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/logs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                showResult('log-event', result, !response.ok);
                if (response.ok) {
                    document.getElementById('log-message').value = '';
                }
            } catch (error) {
                showResult('log-event', error.message, true);
            }
        }

        async function loadRecentLogs() {
            try {
                const response = await fetch(`${API_URL}/logs/recent/60?limit=20`);
                const data = await response.json();
                showResult('log-event', data);
            } catch (error) {
                showResult('log-event', error.message, true);
            }
        }

        // Advanced
        async function getStats() {
            const resultDiv = document.getElementById('advanced-result');
            try {
                const [detStats, eventStats, cmdStats, logStats] = await Promise.all([
                    fetch(`${API_URL}/detections/stats/all`).then(r => r.json()),
                    fetch(`${API_URL}/events/stats/all`).then(r => r.json()),
                    fetch(`${API_URL}/commands/stats/all`).then(r => r.json()),
                    fetch(`${API_URL}/logs/stats/all`).then(r => r.json())
                ]);

                const stats = {
                    detections: detStats.data,
                    events: eventStats.data,
                    commands: cmdStats.data,
                    logs: logStats.data
                };

                showResult('advanced-result', stats);
            } catch (error) {
                showResult('advanced-result', error.message, true);
            }
        }

        async function testAllEndpoints() {
            const resultDiv = document.getElementById('advanced-result');
            const endpoints = [
                { name: 'API Overview', url: '/api' },
                { name: 'Health Check', url: '/health' },
                { name: 'DB Health', url: '/db-health' },
                { name: 'Users', url: '/users' },
                { name: 'Detections', url: '/detections' },
                { name: 'Events', url: '/events' },
                { name: 'Commands', url: '/commands' },
                { name: 'Logs', url: '/logs' }
            ];

            let results = [];
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(`${API_URL}${endpoint.url}`);
                    results.push({
                        endpoint: endpoint.name,
                        status: response.status,
                        ok: response.ok
                    });
                } catch (error) {
                    results.push({
                        endpoint: endpoint.name,
                        status: 'Error',
                        ok: false,
                        error: error.message
                    });
                }
            }

            showResult('advanced-result', results);
        }

        function clearResults() {
            document.querySelectorAll('.result').forEach(el => el.innerHTML = '');
        }

        function exportJSON() {
            const data = {
                exportDate: new Date().toISOString(),
                server: document.getElementById('server-status').textContent,
                database: document.getElementById('db-status').textContent,
                counts: {
                    users: document.getElementById('total-users').textContent,
                    detections: document.getElementById('total-detections').textContent,
                    events: document.getElementById('total-events').textContent,
                    commands: document.getElementById('total-commands').textContent
                }
            };

            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `robot-control-export-${Date.now()}.json`;
            link.click();
        }

        // Initialize on load
        window.addEventListener('load', () => {
            checkAllStatus();
            setInterval(checkAllStatus, 30000); // Refresh every 30 seconds
        });
    </script>
</body>
</html>
